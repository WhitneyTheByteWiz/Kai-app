# Gradle Properties for Kai Android Assistant
# Java Toolchain Configuration
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.prefer-jdk=true

# Kotlin JVM Toolchain
kotlin.jvm.toolchain.languageVersion=17
kotlin.jvm.toolchain.jdk=21

# Build Performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Android
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.useAndroidX=true
android.enableJetifier=true

# JVM Args for Gradle Daemon
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true -Djdk.httpclient.allowRestrictedHeaders=host